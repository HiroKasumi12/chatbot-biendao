<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chatbot Biển Đảo Việt Nam</title>

<style>
body{
    margin:0;
    font-family:Segoe UI, sans-serif;
    background:linear-gradient(to bottom,#7fbfff,#e6f4ff);
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* ===== Banner chia đôi ===== */
.banner{
    width:100%;
    height:230px;
    display:flex;
}

.banner div{
    flex:1;
    background-size:cover;
    background-position:center;
    position:relative;
    display:flex;
    align-items:flex-end;
    justify-content:center;
    color:white;
    font-weight:bold;
    font-size:20px;
}

.banner div::after{
    content:"";
    position:absolute;
    inset:0;
    background:rgba(0,0,0,0.35);
}

.banner span{
    position:relative;
    margin-bottom:15px;
    z-index:2;
}

.hoangsa{
    background-image:url("https://upload.wikimedia.org/wikipedia/commons/3/3a/Truong_Sa_Islands.jpg");
}

.truongsa{
    background-image:url("https://upload.wikimedia.org/wikipedia/commons/5/54/Hoang_Sa_Islands.jpg");
}

/* ===== Tiêu đề ===== */
.title{
    text-align:center;
    margin-top:20px;
}

.title h1{
    margin:5px;
    color:#005fa3;
}

.title p{
    margin:0;
    color:#333;
}

/* ===== Chatbox ===== */
.chat-container{
    width:95%;
    max-width:700px;
    height:65vh;
    background:white;
    margin-top:20px;
    border-radius:25px;
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

.chat-box{
    flex:1;
    padding:20px;
    overflow-y:auto;
    background:linear-gradient(to bottom,#f8fbff,#eef6ff);
}

.message{
    margin-bottom:15px;
    padding:12px 16px;
    border-radius:18px;
    max-width:75%;
    line-height:1.4;
}

.user{
    background:#2f6df6;
    color:white;
    align-self:flex-end;
}

.bot{
    background:white;
    border:1px solid #ddd;
    align-self:flex-start;
}

.input-area{
    display:flex;
    border-top:1px solid #ddd;
    background:white;
}

input{
    flex:1;
    padding:15px;
    border:none;
    font-size:16px;
    outline:none;
}

button{
    padding:15px 20px;
    border:none;
    background:#2f6df6;
    color:white;
    font-weight:bold;
    cursor:pointer;
    border-radius:0 0 25px 0;
}

button:hover{
    background:#1f55cc;
}
</style>
</head>

<body>

<div class="banner">
    <div class="hoangsa"><span>Quần đảo Hoàng Sa</span></div>
    <div class="truongsa"><span>Quần đảo Trường Sa</span></div>
</div>

<div class="title">
    <h1>🌊 Chatbot Biển Đảo Việt Nam</h1>
    <p>Tìm hiểu về Hoàng Sa – Trường Sa 🇻🇳</p>
</div>

<div class="chat-container">
    <div class="chat-box" id="chatBox"></div>
    <div class="input-area">
        <input id="userInput" placeholder="Hỏi về biển đảo..." />
        <button onclick="sendMessage()">Gửi</button>
    </div>
</div>

<script>
const API_KEY = "AIzaSyBPnfgp2w1PoqxlgZe04t7ildpdb9CydUs";

async function sendMessage(){
    const input=document.getElementById("userInput");
    const chatBox=document.getElementById("chatBox");
    const text=input.value.trim();
    if(!text) return;

    addMessage(text,"user");
    input.value="";
    addMessage("Đang suy nghĩ...","bot");

    const response=await fetch(
        "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent?key="+API_KEY,
        {
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                contents:[{
                    parts:[{
                        text:"Bạn là chuyên gia giáo dục về chủ quyền biển đảo Việt Nam. Trả lời ngắn gọn, chính xác, dễ hiểu: "+text
                    }]
                }]
            })
        }
    );

    const data=await response.json();
    document.querySelector(".bot:last-child").remove();
    const botText=data.candidates[0].content.parts[0].text;
    addMessage(botText,"bot");
}

function addMessage(text,sender){
    const chatBox=document.getElementById("chatBox");
    const msg=document.createElement("div");
    msg.classList.add("message",sender);
    msg.innerText=text;
    chatBox.appendChild(msg);
    chatBox.scrollTop=chatBox.scrollHeight;
}
</script>

</body>
</html>
